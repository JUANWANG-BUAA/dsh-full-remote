name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test, build
        run: pnpm run check:ci

      - name: Production dependency audit
        run: pnpm run audit:prod

  smoke:
    # Real-boot seam-drift alarm: installs this bundle through the
    # community-standard `dsh plugin add` flow into a temp profile, boots a
    # real DeepSeek Harness web composition, and exercises the control
    # surface, login gate, rate limiter, and index polyfill over HTTP.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install plugin dependencies
        run: pnpm install --frozen-lockfile

      # Pin the latest DeepSeek Harness release candidate for the real-boot smoke.
      - name: Fetch DeepSeek Harness checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: a66e4702047846cdaa10c66c9d3df3951f5ea70d
          path: .harness
          filter: blob:none

      - name: Install harness (its own pnpm via corepack)
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
        working-directory: .harness

      # dsh boots host packages, client bundles, and the web frontend from
      # build outputs: a fresh checkout has none of them, so the profile
      # would fail with MissingClientBundleError / "frontend dist not
      # built". Build everything first.
      - name: Build harness (lib + web)
        run: corepack pnpm run build
        working-directory: .harness

      - name: Real-boot smoke test
        run: node scripts/smoke.mjs
        env:
          HARNESS_DIR: ${{ github.workspace }}/.harness
          PACK_PLUGIN: '1'

      - name: Validate composition row ownership
        run: pnpm run test:composition
        env:
          HARNESS_DIR: ${{ github.workspace }}/.harness

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce Node coverage thresholds
        run: pnpm run test:unit:coverage

      - name: Enforce client coverage thresholds
        run: pnpm run test:client:coverage

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Chromium browser smoke
        run: pnpm run test:browser
