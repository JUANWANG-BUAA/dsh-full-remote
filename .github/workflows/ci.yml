name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # devDependencies pin the DSh type packages to a sibling checkout
      # (`link:../deepseek-harness/...`). actions/checkout only writes inside
      # the workspace, so clone into `.harness` and symlink it into place.
      - name: Fetch DeepSeek Harness checkout
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 47f943859bef60e4160492346772ded9b24f765a
          path: .harness
          filter: blob:none

      - name: Link harness as the sibling checkout devDependencies expect
        run: ln -s "$GITHUB_WORKSPACE/.harness" "$(dirname "$GITHUB_WORKSPACE")/deepseek-harness"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck, test, and build
        run: pnpm run check
