name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test, build
        run: pnpm run check:ci

      - name: Production dependency audit
        run: pnpm run audit:prod

  smoke:
    # Real-boot seam-drift alarm: installs this bundle through the
    # community-standard `dsh plugin add` flow into a temp profile, boots a
    # real DeepSeek Harness web composition, and exercises the control
    # surface, login gate, rate limiter, and index polyfill over HTTP.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install plugin dependencies
        run: pnpm install --frozen-lockfile

      # The harness has no published CLI: boot from a pinned source checkout.
      - name: Fetch DeepSeek Harness checkout
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 47f943859bef60e4160492346772ded9b24f765a
          path: .harness
          filter: blob:none

      - name: Install harness (its own pnpm via corepack)
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
        working-directory: .harness

      # dsh boots host packages, client bundles, and the web frontend from
      # build outputs: a fresh checkout has none of them, so the profile
      # would fail with MissingClientBundleError / "frontend dist not
      # built". Build everything first.
      - name: Build harness (lib + web)
        run: corepack pnpm run build
        working-directory: .harness

      - name: Real-boot smoke test
        run: node scripts/smoke.mjs
        env:
          HARNESS_DIR: ${{ github.workspace }}/.harness
          PACK_PLUGIN: '1'
